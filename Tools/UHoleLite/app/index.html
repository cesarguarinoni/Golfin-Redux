<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHole Lite — Hole Viewer</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <main class="app-shell">
    <div class="page-shell">

      <aside class="sidebar">
        <div class="brand">
          <div class="eyebrow">UHole Lite</div>
          <h1>Hole Viewer</h1>
          <p id="course-name">Loading course data…</p>
        </div>

        <nav class="nav" id="hole-nav"></nav>

        <div class="sidebar-card" id="sidebar-info">
          <div class="eyebrow">Selected hole</div>
          <p>Click a hole to begin.</p>
        </div>
      </aside>

      <section class="main">
        <header class="hero">
          <div>
            <div class="eyebrow">Zone Editor</div>
            <h2 id="hole-title">Select a hole</h2>
          </div>
          <div class="hero-actions">
            <button id="btn-regen" title="Regenerate heightmap from current zones">⟳ Regen Heightmap</button>
            <button id="btn-save">Save</button>
            <button id="btn-save-as" title="Export hole snapshot to a file">Save As</button>
            <button id="btn-load" title="Load a hole snapshot from file">Load</button>
            <input type="file" id="load-file-input" accept=".json" hidden>
          </div>
          <div class="hero-io">
            <div class="io-group">
              <span class="io-label">Export</span>
              <button id="export-all-btn" title="Export all zones as one PNG">All</button>
              <button id="export-terrain-btn" title="Export terrain layer">Terrain</button>
              <button id="export-trees-btn" title="Export trees layer">Trees</button>
              <button id="export-cartpath-btn" title="Export cart path layer">Cart Path</button>
              <button id="export-ob-btn" title="Export OB layer">OB</button>
            </div>
            <div class="io-group">
              <span class="io-label">Import</span>
              <button id="import-terrain-btn" title="Import terrain layer from PNG">Terrain</button>
              <input type="file" id="import-terrain-file" accept=".png,.jpg,.jpeg" hidden>
              <button id="import-trees-btn" title="Import trees layer from PNG">Trees</button>
              <input type="file" id="import-trees-file" accept=".png,.jpg,.jpeg" hidden>
              <button id="import-cartpath-btn" title="Import cart path layer from PNG">Cart Path</button>
              <input type="file" id="import-cartpath-file" accept=".png,.jpg,.jpeg" hidden>
              <button id="import-ob-btn" title="Import OB layer from PNG">OB</button>
              <input type="file" id="import-ob-file" accept=".png,.jpg,.jpeg" hidden>
            </div>
          </div>
        </header>

        <div id="save-banner" class="status-banner">&nbsp;</div>

        <!-- View toolbar -->
        <div class="alignment-toolbar">
          <h4 class="toolbar-title">View</h4>
          <div class="mode-switcher">
            <button class="mode-btn view-btn is-active" data-view="illustration">Map</button>
            <button class="mode-btn view-btn" data-view="both">Overlay</button>
            <button class="mode-btn view-btn" data-view="heightmap">Height</button>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="opacity-control">
            <span style="font-size:0.82rem;color:var(--muted)">Opacity</span>
            <input type="range" id="overlay-opacity" min="0" max="100" value="50">
          </div>
        </div>

        <!-- Layer bar -->
        <div class="alignment-toolbar" id="layer-bar" hidden></div>

        <!-- Zone legend + paint controls -->
        <div class="zone-legend" id="zone-legend" hidden></div>

        <div class="alignment-toolbar" id="brush-toolbar" hidden>
          <h4 class="toolbar-title">Paint</h4>
          <span id="active-brush-label" class="chip">No brush</span>
          <div class="mode-switcher">
            <button class="mode-btn paint-mode-btn is-active" data-paintmode="brush">Brush</button>
            <button class="mode-btn paint-mode-btn" data-paintmode="fill">Fill</button>
            <button class="mode-btn paint-mode-btn" data-paintmode="eraser">Eraser</button>
          </div>
          <div class="toolbar-spacer"></div>
          <span id="brush-size-group">
            <span style="font-size:0.82rem;color:var(--muted)">Size</span>
            <input type="range" id="brush-size" min="1" max="40" value="10"
              style="width:80px;accent-color:var(--accent)">
            <span id="brush-size-label" style="font-size:0.82rem;color:var(--muted)">10px</span>
          </span>
          <button id="btn-smooth-ob" hidden title="Smooth OB boundary (vectorize → simplify → smooth)">Smooth OB</button>
          <button id="btn-smooth-cp" hidden title="Smooth Cart Path boundary (vectorize → simplify → smooth)">Smooth Cart Path</button>
          <button id="btn-clear-brush">Deselect</button>
        </div>

        <!-- Canvas stage -->
        <div class="stacked-stage" id="canvas-stage">
          <canvas id="hole-canvas"></canvas>
        </div>

        <!-- Info bar -->
        <div class="stats" id="hole-stats" style="margin-top:1rem"></div>

      </section>
    </div>
  </main>

  <script src="/app/app.js"></script>
</body>
</html>
