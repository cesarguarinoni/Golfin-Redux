<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoAlign — Geo-Alignment Tool</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <main class="app-shell">
    <div class="page-shell">

      <aside class="sidebar">
        <div class="brand">
          <div class="eyebrow">UHole Lite</div>
          <h1>GeoAlign</h1>
          <p id="course-name">Loading course data...</p>
        </div>

        <nav class="nav" id="hole-nav"></nav>

        <div class="sidebar-card" id="sidebar-info">
          <div class="eyebrow">Alignment Status</div>
          <p id="info-status">Select a hole to begin.</p>
          <p id="info-points"></p>
          <p id="info-error"></p>
          <p id="info-saved"></p>
        </div>

        <div class="sidebar-actions">
          <button id="btn-save">Save</button>
          <button id="btn-load">Load</button>
          <button id="btn-clear">Clear</button>
        </div>
        <div class="sidebar-actions" style="padding-top:0">
          <button id="btn-refetch" title="Re-download GSI satellite tiles from server">Re-fetch Tiles</button>
        </div>
      </aside>

      <section class="main">
        <header class="hero">
          <div>
            <div class="eyebrow">Geo-Alignment Tool</div>
            <h2 id="hole-title">Select a hole</h2>
          </div>
        </header>

        <div id="save-banner" class="status-banner">&nbsp;</div>

        <!-- Mode toolbar -->
        <div class="alignment-toolbar">
          <h4 class="toolbar-title">Mode</h4>
          <div class="mode-switcher">
            <button class="mode-btn tool-mode-btn is-active" data-mode="navigate">Navigate</button>
            <button class="mode-btn tool-mode-btn" data-mode="point">Point</button>
          </div>
          <div class="toolbar-spacer"></div>
          <span id="cp-count" class="chip">CP: 0</span>
        </div>

        <!-- View toolbar -->
        <div class="alignment-toolbar">
          <h4 class="toolbar-title">View</h4>
          <div class="opacity-control">
            <span class="ctrl-label">Opacity</span>
            <input type="range" id="gsi-opacity" min="0" max="100" value="50">
            <input type="number" id="opacity-input" class="ctrl-input" value="50" min="0" max="100" step="1">
            <span class="ctrl-unit">%</span>
          </div>
          <div class="opacity-control">
            <span class="ctrl-label">Rotation</span>
            <input type="range" id="gsi-rotation" class="wide-slider" min="-30" max="30" value="0" step="0.05">
            <input type="number" id="rotation-input" class="ctrl-input" value="0" min="-180" max="180" step="0.5">
            <span class="ctrl-unit">&deg;</span>
          </div>
          <div class="opacity-control">
            <span class="ctrl-label">Scale</span>
            <input type="range" id="gsi-scale" min="50" max="300" value="100" step="1">
            <input type="number" id="scale-input" class="ctrl-input" value="1.00" min="0.1" max="5" step="0.05">
            <span class="ctrl-unit">x</span>
          </div>
          <button id="btn-reset-view">Reset</button>
          <button id="btn-save-pos" title="Save current GSI position">Save Pos</button>
          <button id="btn-load-pos" title="Restore saved GSI position" disabled>Load Pos</button>
          <button id="btn-apply-transform" disabled>Apply Transform</button>
        </div>

        <!-- Canvas stage -->
        <div class="stacked-stage" id="canvas-stage">
          <canvas id="align-canvas"></canvas>
        </div>

        <!-- Control points table -->
        <div class="cp-table" id="cp-table">
          <div class="cp-header">
            <span>ID</span>
            <span>Illustration (px)</span>
            <span>World (lat, lon)</span>
            <span>Error</span>
            <span></span>
          </div>
        </div>

      </section>
    </div>
  </main>

  <script src="/app/app.js"></script>
</body>
</html>
