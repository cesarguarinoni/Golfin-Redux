# Lomond Green Topology Manifest
# Source: Docs/Specs/Queued/green_topology_and_pin_authoring/A4_ホール攻略冊子.pdf
#         (Lomond Country Club official strategy booklet, 2019, Adobe InDesign CS5.5_J)
# Cross-reference: Docs/Specs/Queued/green_topology_and_pin_authoring/screenshots/
#                  (18 × Shot Navi 3DX strategy + 18 × heatmap captures)
# Extracted by: Architect (claude.ai), 2026-05-27
#
# CONVENTIONS
# ===========
#
# Coordinate frame: 'green-local' — fractions of the green polygon's AABB.
#   • boundsFrac: [xMin, yMin, xMax, yMax] each in [0, 1]
#     • x = 0 → PDF-left edge of green, x = 1 → PDF-right edge
#     • y = 0 → PDF-bottom (front of green, near approach), y = 1 → PDF-top (back of green)
#   • posFrac: [x, y] in [0, 1], same axes
#   • polylineFrac: list of [x, y] vertices in [0, 1]
#
# Slope vectors: 'pdf-local' 2D — [dirRight, dirBack] (== [dirX, dirY] in PDF panel coords).
#   • [-1, 0] = water flows LEFT  (PDF ←)
#   • [+1, 0] = water flows RIGHT (PDF →)
#   • [0, -1] = water flows FRONT (PDF ↓; toward approach/tee)   ← most common at Lomond
#   • [0, +1] = water flows BACK  (PDF ↑; away from approach)
#   • Diagonals: e.g. [-0.7, -0.7] = ↙ (down-left)
#   • These get resolved to world XZ at apply-time using each hole's approach direction
#     (computed from teePosition → greenCentroid in zones.json).
#
# Magnitude: percent slope (rise/run × 100). Lomond character is subtle:
#   • 1.0–1.5%  — minimal / visually flat ('傾斜の少ない')
#   • 1.5–2.5%  — '見た目よりはやい' (faster than it looks) — the most common pattern
#   • 2.5–4.0%  — clearly perceptible slope
#   • 4.0–6.0%  — ridge transition bands only
#   • Above 6%  — not used at Lomond per the PDF (no greens this steep)
#
# Confidence: arrow-counting from the PDF panel is inherently approximate.
#   • high   — arrows clearly readable, single dominant direction or unambiguous tiers
#   • medium — multi-directional or ambiguous arrow clusters; magnitude estimated
#   • low    — complex pattern (e.g. mounding); may need Cesar visual-gate refinement
#
# Region precedence: later regions override earlier ones in the same cell.
# Ridges write LAST and override base regions in a transition band of width
# 'transitionBandMeters' centered on the polyline.

