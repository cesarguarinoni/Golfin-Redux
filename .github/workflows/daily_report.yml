name: Daily Report

# Cloud-run daily Telegram report — independent of Cesar's Mac (which repeatedly
# slept through / coalesced-away the local launchd trigger). Runs on GitHub's
# servers at 20:30 Asia/Tokyo, Mon–Fri. See Docs/Scripts/DAILY_REPORT_SETUP.md §7.
#
# Timezone: GitHub cron is UTC and Japan has no DST, so 20:30 JST == 11:30 UTC
# year-round. The job also exports TZ=Asia/Tokyo so the script's own weekday /
# send-window logic evaluates in JST (11:30 UTC = 20:30 JST, same weekday).

on:
  schedule:
    - cron: '30 11 * * 1-5'      # 11:30 UTC = 20:30 JST, Monday–Friday
  workflow_dispatch:             # manual trigger (for testing)
    inputs:
      test:
        description: 'Send to the TEST Telegram channel instead of production'
        type: boolean
        default: false
      force:
        description: 'Bypass weekend/window/dedupe (send now regardless)'
        type: boolean
        default: false

concurrency:
  group: daily-report            # never run two at once
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
    steps:
      - name: Check out repo (full history for the 24h/72h git window)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic requests python-dotenv

      - name: Send daily report
        run: |
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Running: daily_report.py $ARGS  (TZ=$TZ, now=$(date '+%F %T %Z'))"
          python Docs/Scripts/daily_report.py $ARGS
